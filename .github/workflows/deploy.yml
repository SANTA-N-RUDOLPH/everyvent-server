name: Deploy to Test Server

on:
  workflow_run:
    workflows: [ "CI" ]
    types:
      - completed
    branches: [ develop ]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: EC2에 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/everyvent-server

            # GHCR에서 최신 이미지 pull
            docker pull ghcr.io/santa-n-rudolph/everyvent-server:develop-latest || { echo "❌ Image pull failed"; exit 1; }

            # Docker Compose로 재시작
            docker-compose down || true
            docker-compose up -d || { echo "❌ Services failed to start"; exit 1; }

            # 서비스 안정화 대기 및 상태 확인
            echo "⏳ Waiting for services to stabilize..."
            sleep 5
            for i in {1..30}; do
              if docker-compose ps --services --filter "status=running" | grep -q .; then
                echo "✅ Services are running"
                docker-compose logs --tail=50
                exit 0
              fi
              sleep 1
            done
            echo "❌ Services failed to start within timeout"
            docker-compose logs --tail=100
            exit 1

      - name: 배포 성공 알림
        if: success()
        run: echo "🚀 EC2 배포가 성공했습니다!"

      - name: 배포 실패 알림
        if: failure()
        run: echo "❌ EC2 배포가 실패했습니다."
