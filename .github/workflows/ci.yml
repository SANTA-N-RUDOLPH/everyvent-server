name: CI

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: 빌드 및 단위 테스트
        run: ./gradlew clean build --tests '*Test' -DincludeTags=unit

      - name: 테스트 결과 리포트
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/test/TEST-*.xml'

      - name: 빌드 성공 알림
        if: success()
        run: echo "✅ 빌드 및 테스트가 성공했습니다!"

      - name: 빌드 실패 알림
        if: failure()
        run: echo "❌ 빌드 또는 테스트가 실패했습니다."

      - name: Docker 메타데이터 추출
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hyeblee/everyvent-server
          tags: |
            type=raw,value=develop-latest
            type=sha,prefix=develop-,format=short

      - name: GHCR 로그인
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hyeblee
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 이미지 푸시 성공 알림
        if: success() && github.event_name == 'push'
        run: echo "🐳 Docker 이미지가 GHCR에 푸시되었습니다!"
